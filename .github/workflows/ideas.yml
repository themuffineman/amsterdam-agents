# Content ideas pages agent (sycamore.to/ideas/...). Claims one topic from the studio,
# researches and writes the page with Pi, and the studio checks and saves it.
# Run it by hand from the Actions tab ("Run workflow") or let the schedule do it.
name: ideas agent

on:
  schedule:
    # Hourly, at :17 (GitHub delays runs at :00). Most runs just ask the studio and stop:
    # how many pages a day (and whether at all) is set on the studio's /agents screen.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      topics:
        description: "How many topics this run (default from agents/ideas.json)"
        required: false
      engine:
        description: "Engine for this run only (default: the campaign's setting on the studio's /agents screen)"
        required: false
        type: choice
        options: ["", "pi", "claude-code"]
      model:
        description: "OpenRouter model for this run only, Pi engine (e.g. nvidia/nemotron-3-ultra-550b-a55b:free)"
        required: false

# One run at a time: a slow run makes the next one wait instead of overlapping.
concurrency:
  group: ideas-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # watch_video transcribes videos without captions (audio from Invidious or snapsave) with Whisper,
      # free on the CPU (scripts/transcribe.py). The model downloads once, then comes from the cache.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # av pinned: faster-whisper 1.2.1 passes open(metadata_errors=...), which newer PyAV dropped.
      - run: pip install faster-whisper==1.2.1 av==17.0.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1
      # The claude-code engine (a campaign switched to it on /agents) runs the Claude Code CLI.
      - run: npm install -g @anthropic-ai/claude-code --no-audit --no-fund
      # Our own search engine (searxng/settings.yml), free: web_search and find_examples try it
      # before the paid OpenRouter search. If it doesn't start, every search just uses the paid one.
      - name: Start SearXNG
        run: |
          docker run -d --name searxng -p 8080:8080 -v "$PWD/searxng:/etc/searxng" searxng/searxng:latest
          for i in $(seq 30); do curl -sf http://localhost:8080/healthz >/dev/null && echo "SearXNG up" && exit 0; sleep 2; done
          docker logs searxng || true
          echo "::warning::SearXNG didn't start; searches will use the paid fallback"
      - name: Run agent
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEARXNG_URL: http://localhost:8080
          # watch_video's last YouTube fallback (optional; a free-tier key from a project without billing)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # read_page's Reddit threads, through the Apify Reddit scraper (about 1 cent a thread, max 3 a post)
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # The claude-code engine: a token from `claude setup-token` (Claude subscription, no per-token bill)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TOPICS_PER_RUN: ${{ inputs.topics }}
          ENGINE: ${{ inputs.engine }}
          MODEL: ${{ inputs.model }}
        run: node src/run.ts ideas
      # Something above failed (a setup step, or the runner crashed): tell the studio, so it
      # shows in the /agents Problems panel. A runner crash also reports its own error.
      - name: Report the failure to the studio
        if: failure()
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="{\"runId\":null,\"runUrl\":\"$run_url\",\"problems\":[{\"source\":\"workflow\",\"message\":\"the GitHub workflow failed (a setup step, or the runner crashed): see the run log\",\"at\":\"$(date -u +%FT%TZ)\"}]}"
          curl -sSf -X POST "${STUDIO_URL%/}/api/agent/ideas/problems" -H "Authorization: Bearer $AGENT_API_KEY" -H "Content-Type: application/json" -d "$body" || echo "::warning::couldn't tell the studio"
