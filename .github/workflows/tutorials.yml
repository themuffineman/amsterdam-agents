# Tutorials agent (sycamore.to/blog/tutorial/...: how to do or fix one thing in an editor).
# Claims one Reddit help thread from the studio's tutorial queue and writes the tutorial from
# it alone (no web research, so no SearXNG), and the studio checks and saves it.
# Run it by hand from the Actions tab ("Run workflow") or let the schedule do it.
name: tutorials agent

on:
  schedule:
    # Hourly, at :32 (ideas run at :17, blog posts at :47). Most runs just ask the studio and
    # stop: how many tutorials a day (and whether at all) is set on the studio's /agents screen.
    - cron: "32 * * * *"
  workflow_dispatch:
    inputs:
      topics:
        description: "How many topics this run (default from agents/tutorials.json)"
        required: false
      engine:
        description: "Engine for this run only (default: the campaign's setting on the studio's /agents screen)"
        required: false
        type: choice
        options: ["", "pi", "claude-code"]
      model:
        description: "OpenRouter model for this run only, Pi engine (e.g. nvidia/nemotron-3-ultra-550b-a55b:free)"
        required: false

# One run at a time: a slow run makes the next one wait instead of overlapping.
concurrency:
  group: tutorials-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The claude-code engine (a campaign switched to it on /agents) runs the Claude Code CLI.
      - run: npm install -g @anthropic-ai/claude-code --no-audit --no-fund
      - name: Run agent
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The claude-code engine: a token from `claude setup-token` (Claude subscription, no per-token bill)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TOPICS_PER_RUN: ${{ inputs.topics }}
          ENGINE: ${{ inputs.engine }}
          MODEL: ${{ inputs.model }}
        run: node src/run.ts tutorials
