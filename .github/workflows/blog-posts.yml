# Blog posts agent (sycamore.to/blog/...: comparisons, alternatives, best-of lists,
# how-tos). Claims one topic from the studio, researches and writes the post with Pi, and
# the studio checks and saves it.
# Run it by hand from the Actions tab ("Run workflow") or let the schedule do it.
name: blog posts agent

on:
  schedule:
    # Hourly, at :47 (the ideas agent runs at :17; GitHub delays runs at :00). Most runs just
    # ask the studio and stop: how many posts a day (and whether at all) is set on the
    # studio's /agents screen.
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      topics:
        description: "How many topics this run (default from agents/blog-posts.json)"
        required: false
      engine:
        description: "Engine for this run only (default: the campaign's setting on the studio's /agents screen)"
        required: false
        type: choice
        options: ["", "pi", "claude-code"]

# One run at a time: a slow run makes the next one wait instead of overlapping.
concurrency:
  group: blog-posts-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # watch_video reads videos with yt-dlp (screenshot uses the runner's own Chrome).
      - run: pipx install yt-dlp
      # The claude-code engine (a campaign switched to it on /agents) runs the Claude Code CLI.
      - run: npm install -g @anthropic-ai/claude-code --no-audit --no-fund
      - name: Run agent
        env:
          STUDIO_URL: ${{ secrets.STUDIO_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # watch_video's fallback for Instagram and videos without captions (free plan: 100 credits a month)
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # The claude-code engine: a token from `claude setup-token` (Claude subscription, no per-token bill)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TOPICS_PER_RUN: ${{ inputs.topics }}
          ENGINE: ${{ inputs.engine }}
        run: node src/run.ts blog-posts
